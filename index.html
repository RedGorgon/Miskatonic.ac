/* ---------- Manuscript Reader ---------- */
const readerOverlay = document.getElementById("readerOverlay");
const manuscriptBody = document.getElementById("manuscriptBody");
const readerTopTitle = document.getElementById("readerTopTitle");
const readerCloseBtn = document.getElementById("readerCloseBtn");

let currentChapters = [];
let currentChapterIdx = 0;
let currentReaderStoryId = null;

function italicize(text){
  return text.replace(/\*([^*]+)\*/g, "<em>$1</em>");
}

function titleCaseWords(str){
  return str.toLowerCase().replace(/\b\w/g, c=>c.toUpperCase());
}

// Turns "PART III. — THE MADNESS FROM THE SEA (EXCERPT)" into "III · The Madness From The Sea"
function shortChapterLabel(heading){
  const parts = heading.split("—").map(s=>s.trim());
  if(parts.length > 1){
    const roman = parts[0].replace(/^PART\s*/i, "").replace(/\.$/,"").trim();
    const title = titleCaseWords(parts[1].split("(")[0].trim());
    return `${roman} · ${title}`;
  }
  return titleCaseWords(heading);
}

// Groups a flat block list into chapters, splitting at each heading block.
function chapterizeBlocks(blocks){
  const chapters = [];
  let current = null;
  blocks.forEach(b=>{
    if(b.type === "heading"){
      current = { heading:b.text, blocks:[] };
      chapters.push(current);
    } else {
      if(!current){ current = { heading:null, blocks:[] }; chapters.push(current); }
      current.blocks.push(b);
    }
  });
  return chapters;
}

function openReader(storyId){
  const s = storyById(storyId);
  if(!s || !s.fullText) return;
  currentReaderStoryId = storyId;
  currentChapters = chapterizeBlocks(s.fullText);
  currentChapterIdx = 0;
  readerTopTitle.textContent = s.title;
  renderChapter();
  readerOverlay.classList.add("open");
  window.scrollTo(0,0);
}

function renderChapter(){
  const s = storyById(currentReaderStoryId);
  const chapter = currentChapters[currentChapterIdx];
  const isFirst = currentChapterIdx === 0;
  const isLast = currentChapterIdx === currentChapters.length - 1;

  const tocHtml = currentChapters.map((c,i)=>
    `<button class="toc-pill ${i===currentChapterIdx ? 'active' : ''}" data-idx="${i}">${c.heading ? shortChapterLabel(c.heading) : 'Prologue'}</button>`
  ).join("");

  let firstParaDone = false;
  let bodyHtml = "";
  chapter.blocks.forEach(b=>{
    if(b.type === "note"){
      bodyHtml += `<p class="ms-note">${b.text}</p>`;
    } else {
      const cls = !firstParaDone ? "after-heading" : "";
      firstParaDone = true;
      bodyHtml += `<p class="${cls}">${italicize(b.text)}</p>`;
    }
  });

  manuscriptBody.innerHTML = `
    <p class="ms-eyebrow">Transcribed from the original periodical</p>
    <h1 class="ms-title">${s.title}</h1>
    <p class="ms-byline">by H.P. Lovecraft</p>
    <p class="ms-provenance">Written ${s.yearWritten} &nbsp;·&nbsp; First published ${s.yearPublished} &nbsp;·&nbsp; ${s.publication}</p>
    <div class="ms-rule"></div>
    <div class="toc-row">${tocHtml}</div>
    ${chapter.heading ? `<p class="ms-heading">${chapter.heading}</p>` : ""}
    <div class="ms-body">${bodyHtml}</div>
    <div class="chapter-nav">
      <button class="chapter-btn" id="prevChBtn" ${isFirst ? "disabled" : ""}>← Previous</button>
      <span class="chapter-count">Section ${currentChapterIdx + 1} of ${currentChapters.length}</span>
      <button class="chapter-btn" id="nextChBtn" ${isLast ? "disabled" : ""}>Next →</button>
    </div>
    ${isLast ? `<p class="ms-endmark">❦ End of excerpt ❦</p>` : ""}
  `;

  manuscriptBody.querySelectorAll(".toc-pill").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      currentChapterIdx = parseInt(btn.dataset.idx, 10);
      renderChapter();
      readerOverlay.scrollTop = 0;
    });
  });
  const prevBtn = document.getElementById("prevChBtn");
  const nextBtn = document.getElementById("nextChBtn");
  if(prevBtn) prevBtn.addEventListener("click", ()=>{
    if(currentChapterIdx > 0){ currentChapterIdx--; renderChapter(); readerOverlay.scrollTop = 0; }
  });
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    if(currentChapterIdx < currentChapters.length - 1){ currentChapterIdx++; renderChapter(); readerOverlay.scrollTop = 0; }
  });

  readerOverlay.scrollTop = 0;
}

function closeReader(){
  readerOverlay.classList.remove("open");
}
readerCloseBtn.addEventListener("click", closeReader);
document.addEventListener("keydown", e=>{ if(e.key === "Escape" && readerOverlay.classList.contains("open")) closeReader(); });
